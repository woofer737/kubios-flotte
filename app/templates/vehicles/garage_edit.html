{% extends "base.html" %}
{% block title %}Garage{% endblock %}
{% block content %}
<h4 class="mb-3">{{ g.name if g.id else 'Nouveau garage / atelier' }}</h4>
<form method="post" class="card card-body" style="max-width:700px">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="row g-2">
    <div class="col-md-8"><label class="form-label small mb-0">Nom *</label><input name="name" value="{{ g.name or '' }}" class="form-control" required></div>
    <div class="col-md-4"><label class="form-label small mb-0">Type</label>
      <select name="kind" class="form-select">{% for k, l in [('vehicule','Véhicules'),('outil','Outils'),('les_deux','Véhicules et outils')] %}<option value="{{ k }}" {{ 'selected' if g.kind == k }}>{{ l }}</option>{% endfor %}</select></div>
    <div class="col-md-6"><label class="form-label small mb-0">Personne-ressource</label><input name="contact" value="{{ g.contact or '' }}" class="form-control"></div>
    <div class="col-md-6"><label class="form-label small mb-0">Téléphone</label><input name="phone" value="{{ g.phone or '' }}" class="form-control"></div>
    <div class="col-md-6"><label class="form-label small mb-0">Courriel</label><input type="email" name="email" value="{{ g.email or '' }}" class="form-control"></div>
    <div class="col-md-6"><label class="form-label small mb-0">Adresse</label><input name="address" value="{{ g.address or '' }}" class="form-control"></div>
    <div class="col-12"><label class="form-label small mb-0">Notes (heures d'ouverture, etc.)</label><textarea name="notes" class="form-control">{{ g.notes or '' }}</textarea></div>
  </div>
  <div class="mt-3"><button class="btn btn-primary">Enregistrer</button> <a href="{{ url_for('vehicles.garages') }}" class="btn btn-link">Annuler</a></div>
</form>
{% endblock %}
