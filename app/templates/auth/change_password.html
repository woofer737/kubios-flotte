{% extends "base.html" %}
{% block title %}Mot de passe{% endblock %}
{% block content %}
<div class="login-wrap">
  <h4>Changer mon mot de passe</h4>
  {% if current_user.must_change_password %}<div class="alert alert-warning">Vous devez choisir un nouveau mot de passe avant de continuer.</div>{% endif %}
  <div class="card"><div class="card-body p-4">
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label">Mot de passe actuel</label><input type="password" name="current" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Nouveau mot de passe</label><input type="password" name="password" class="form-control" required minlength="10">
        <div class="form-text">10 caractères minimum, lettres et chiffres.</div></div>
      <div class="mb-3"><label class="form-label">Confirmer</label><input type="password" name="password2" class="form-control" required></div>
      <button class="btn btn-primary w-100">Enregistrer</button>
    </form>
  </div></div>
</div>
{% endblock %}
