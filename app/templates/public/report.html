{% extends "base.html" %}
{% block title %}Signaler un bris{% endblock %}
{% block content %}
<div style="max-width:560px;margin:3vh auto">
  <h4><i class="bi bi-exclamation-triangle"></i> Signaler un bris de véhicule</h4>
  <form method="post" enctype="multipart/form-data" class="card card-body mt-3">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input name="website" class="d-none" tabindex="-1" autocomplete="off">
    <div class="mb-2"><label class="form-label">Numéro d'unité *</label><input name="unit" class="form-control" required inputmode="numeric"></div>
    <div class="mb-2"><label class="form-label">Votre nom *</label><input name="name" class="form-control" required></div>
    <div class="row g-2 mb-2"><div class="col"><label class="form-label">Téléphone</label><input name="phone" class="form-control"></div>
      <div class="col"><label class="form-label">Courriel</label><input type="email" name="email" class="form-control"></div></div>
    <div class="mb-2"><label class="form-label">Description du problème *</label><textarea name="description" rows="4" class="form-control" required></textarea></div>
    <div class="mb-3"><label class="form-label">Photos</label><input type="file" name="photos" accept="image/*" multiple class="form-control"></div>
    <button class="btn btn-primary w-100">Envoyer</button>
  </form>
</div>
{% endblock %}
